<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InterviewIQ - Programming Interview</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="interview-container">

        <div class="interview-header">

       <div class="logo">
        Interview<span>IQ</span>
       </div>

      <div class="interview-category" id="interviewCategory">
        General Programming
      </div>

     <div class="progress" id="progress">
        Question 1 of 15
     </div>

</div>
        <div class="question-card">

            <div class="question-info">

                <span class="question-number" id="questionNumber">
                    Question 1
                </span>

                <span class="difficulty" id="difficulty">
                    Beginner
                </span>

            </div>


            <h1 id="question">
                Loading question...
            </h1>


            <p class="question-hint" id="hint">
                Please wait...
            </p>


            <textarea
                id="answer"
                placeholder="Type your answer here..."
            ></textarea>


            <div class="button-group">

                <button
                    class="start-btn"
                    id="submitBtn"
                    onclick="submitAnswer()">
                    Submit Answer
                </button>

                <button
                    class="next-btn"
                    id="nextBtn"
                    onclick="nextQuestion()"
                    style="display: none;">
                    Next Question →
                </button>

            </div>


            <div id="feedback"></div>

        </div>

    </main>


    <script>

        const questions = JSON.parse('{{ questions | tojson | safe }}');

        const category = "{{ category }}";

        let currentQuestion = 0;
        let totalScore = 0;
        let scores = [];


        // =============================
        // DISPLAY QUESTION
        // =============================

        function displayQuestion() {
         document.getElementById("interviewCategory").textContent = category;

            const question = questions[currentQuestion];

            document.getElementById("questionNumber").textContent =
                "Question " + question.id;

            document.getElementById("progress").textContent =
                "Question " + question.id + " of " + questions.length;

            document.getElementById("difficulty").textContent =
                question.difficulty;

            document.getElementById("question").textContent =
                question.question;

            document.getElementById("hint").textContent =
                question.hint;

            document.getElementById("answer").value = "";

            document.getElementById("feedback").innerHTML = "";

            document.getElementById("submitBtn").style.display =
                "inline-block";

            document.getElementById("nextBtn").style.display =
                "none";
        }


        // =============================
        // SUBMIT ANSWER
        // =============================

        async function submitAnswer() {

            const answer =
                document.getElementById("answer").value.trim();

            const feedback =
                document.getElementById("feedback");


            if (answer === "") {

                feedback.innerHTML =
                    "⚠️ Please enter your answer first.";

                return;
            }


            feedback.innerHTML =
                "🤖 AI is evaluating your answer...";


            document.getElementById("submitBtn").style.display =
                "none";


            try {

                const response = await fetch("/evaluate", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        question:
                            questions[currentQuestion].question,

                        answer:
                            answer,

                        difficulty:
                            questions[currentQuestion].difficulty
                    })
                });


                const data = await response.json();

                const aiText = data.feedback;


                // =============================
                // GET SCORE
                // =============================

                const score =
                    aiText.match(/Score:\s*(.*)/i)?.[1] || "N/A";

                const formattedScore =
                    score.replace(/\s+/g, " ");

                const scoreNumber =
                    parseInt(score);


                if (!isNaN(scoreNumber)) {

                    scores.push(scoreNumber);

                    totalScore += scoreNumber;
                }


                // =============================
                // GET MISTAKE
                // =============================

                const mistake =
                    aiText.match(/Mistake:\s*(.*)/i)?.[1]
                    || "Not available";


                // =============================
                // GET BETTER ANSWER
                // =============================

                const betterAnswer =
                    aiText.match(
                        /Better answer:\s*([\s\S]*?)(?=\nFeedback:|$)/i
                    )?.[1]
                    || "Not available";


                // =============================
                // GET SHORT FEEDBACK
                // =============================

                const shortFeedback =
                    aiText.match(
                        /Feedback:\s*([\s\S]*)/i
                    )?.[1]
                    || "Not available";


                // =============================
                // SHOW AI FEEDBACK
                // =============================

                feedback.innerHTML = `

                    <div class="ai-feedback">

                        <div class="feedback-title">

                            <span>🤖</span>

                            <div>

                                <h3>AI Evaluation</h3>

                                <p>
                                    Analysis of your interview answer
                                </p>

                            </div>

                        </div>


                        <div class="score-card">

                            <span class="feedback-label">
                                SCORE
                            </span>

                            <strong>
                                ${formattedScore.replace("/", " / ")}
                            </strong>

                        </div>


                        <div class="feedback-item">

                            <span class="feedback-icon">
                                ⚠️
                            </span>

                            <div>

                                <span class="feedback-label">
                                    WHAT TO IMPROVE
                                </span>

                                <p>
                                    ${mistake}
                                </p>

                            </div>

                        </div>


                        <div class="feedback-item better">

                            <span class="feedback-icon">
                                💡
                            </span>

                            <div>

                                <span class="feedback-label">
                                    BETTER ANSWER
                                </span>

                                <p>
                                    ${betterAnswer}
                                </p>

                            </div>

                        </div>


                        <div class="feedback-item">

                            <span class="feedback-icon">
                                💬
                            </span>

                            <div>

                                <span class="feedback-label">
                                    AI FEEDBACK
                                </span>

                                <p>
                                    ${shortFeedback}
                                </p>

                            </div>

                        </div>

                    </div>

                `;


                document.getElementById("nextBtn").style.display =
                    "inline-block";

            }


            catch (error) {

                console.error(error);

                feedback.innerHTML =
                    "❌ AI evaluation failed. Please try again.";

                document.getElementById("submitBtn").style.display =
                    "inline-block";
            }

        }


        // =============================
        // NEXT QUESTION
        // =============================

        function nextQuestion() {

            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                displayQuestion();

            }

            else {
                localStorage.removeItem("interviewSaved");
                localStorage.setItem(
                "category",
                 category
                );

                localStorage.setItem(
                    "totalScore",
                    totalScore
                );

                localStorage.setItem(
                    "totalQuestions",
                    questions.length
                );

                window.location.href = "/result";
            }

        }


        // =============================
        // START INTERVIEW
        // =============================

        displayQuestion();

    </script>

</body>
</html>
